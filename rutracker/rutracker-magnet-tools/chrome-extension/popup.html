<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Extractor de magnet links</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">PESTAÑA ACTUAL</p>
          <h1>Magnet links</h1>
        </div>
        <button id="extract-button" class="secondary" type="button" title="Volver a buscar">Actualizar</button>
      </header>

      <p id="status" role="status" aria-live="polite">Buscando enlaces…</p>
      <progress id="download-progress" max="100" value="0" aria-label="Progreso de descarga" hidden></progress>
      <ol id="results" hidden></ol>
      <button id="copy-all" type="button" hidden>Copiar todos</button>

      <footer>Inicia el helper local para guardar .torrent o descargar el fichero completo; consulta el README.</footer>
    </main>
  </body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btclient-python"
version = "0.1.0"
description = "A small BitTorrent client and Python API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bittorrent-cli = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["btclient*"]
